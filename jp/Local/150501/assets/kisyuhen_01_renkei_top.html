<script type="text/javascript">
function setSocialLoginStatus(array) {
  var elements = document.getElementsByClassName("providor");

  for (var i = 0; i < elements.length; i++) {
    var elementNot = document.getElementById(elements[i].id + "_not");

    if (array.indexOf(elements[i].id) >= 0) {
      elements[i].style.display = "";
      elementNot.style.display = "none";
    }
    else {
      elements[i].style.display = "none";
      elementNot.style.display = "";
    }
  }
}
</script>

		</p>
