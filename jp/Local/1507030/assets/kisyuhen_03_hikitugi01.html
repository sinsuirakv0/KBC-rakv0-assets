<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Expires" content="-1">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0,viewport-fit=cover">
<link rel="stylesheet" type="text/css" href="kisyuhen.css" />
<title>手続きをしたデータを引継ぐ</title>
</head>
<body>
<div align="center" style="height:100%">
    <div id="main_area"> <img src="img_friend02.png" width="100%">
        <p><span class="midashi2">手続きをしたデータを引継ぐ</span></p>
        <hr noshade width="97%" color="#E2AF27">
        <div class="ac_link_conts01">
            <p>
                            引継ぎ用にデータをサーバーに保存した方は、ここから新しい機種にデータを引継ぎすることができます。<br>
                            メモした「引継ぎコード」と「認証番号」を入力してください。
                        </p>

                        <form action="ponos-api://function?cloudsave_load2=1" method="GET">
                            <fieldset>
                                <div align="center">
                                    <span style="font-weight:bold; font-size:large">
                                        引継ぎコード：<input type="text" style="width: 180px; height: 24px; margin:2px;" name="id_accountId" id="id_accountId" size="9" maxlength="9" pattern="^[0-9a-zA-Z]+$" /><br>
                                        認証番号：<input type="text" style="width: 20%; height: 24px; margin:2px;" name="id_pin" id="id_pin" size="4" maxlength="4" pattern="\d*" />
                                    </span><br>
                                   
                                    <br>
                                    <span style="color:#FF0000; font-size:small">
                                    ※ご注意：現在アプリに保存されているデータは上書きされます。
                                    </span><br>
                                    <input type="hidden" name="cloudsave_load2" value="1">
                                   
									<ul class="ac_link_btn01">
										<li><input type="submit" value="引継ぎ開始" class="ac_btn_big"></li>
										<li><a href="kisyuhen_00_kisyuhen_menu.html" class="ac_btn_glay">前の画面に戻る</a></li>
									</ul>
                                </div>
                            </fieldset>
                        </form>
                        <br>
        </div>
           
           
           
        <img src="img_friend03.png" width="100%"><br>
    </div>
</div>
</body>
</html>
